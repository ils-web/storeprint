    <linearGradient id="boxRightFav" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bgGradFavStock)"/>

  <!-- Isometric Warehouse Box -->
  <polygon points="256,100 410,180 256,260 102,180" fill="url(#boxTopFav)"/>
  <polygon points="102,180 256,260 256,410 102,330" fill="url(#boxLeftFav)"/>
  <polygon points="256,260 410,180 410,330 256,410" fill="url(#boxRightFav)"/>

  <!-- Barcode Label -->
  <rect x="280" y="270" width="90" height="48" rx="6" fill="#ffffff" transform="skewY(-15)"/>
  <line x1="290" y1="280" x2="290" y2="308" stroke="#0f172a" stroke-width="4" transform="skewY(-15)"/>
  <line x1="300" y1="280" x2="300" y2="308" stroke="#0f172a" stroke-width="2.5" transform="skewY(-15)"/>
  <line x1="310" y1="280" x2="310" y2="308" stroke="#0f172a" stroke-width="5" transform="skewY(-15)"/>
  <line x1="322" y1="280" x2="322" y2="308" stroke="#0f172a" stroke-width="3" transform="skewY(-15)"/>
  <line x1="334" y1="280" x2="334" y2="308" stroke="#0f172a" stroke-width="4" transform="skewY(-15)"/>
  <line x1="344" y1="280" x2="344" y2="308" stroke="#0f172a" stroke-width="2.5" transform="skewY(-15)"/>
  <line x1="354" y1="280" x2="354" y2="308" stroke="#0f172a" stroke-width="4" transform="skewY(-15)"/>

