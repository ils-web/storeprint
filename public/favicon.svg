<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
    <filter id="shadowPaper" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Top paper sheet coming into printer -->
  <g filter="url(#shadowPaper)">
    <rect x="156" y="90" width="200" height="120" rx="12" fill="url(#paperGrad)"/>
    <rect x="186" y="125" width="140" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="186" y="150" width="90" height="12" rx="6" fill="#94a3b8"/>
  </g>

  <!-- Printer Main Body -->
  <g filter="url(#dropGlow)">
    <rect x="96" y="180" width="320" height="180" rx="36" fill="url(#accentGrad)"/>
    <!-- Sleek front plate -->
    <rect x="116" y="210" width="280" height="130" rx="24" fill="#0f172a" fill-opacity="0.85"/>
  </g>

  <!-- Printer Status LED and Button -->
  <circle cx="150" cy="245" r="8" fill="#10b981"/>
  <circle cx="150" cy="245" r="14" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="175" y="240" width="40" height="10" rx="5" fill="#38bdf8" fill-opacity="0.6"/>

  <!-- Bottom Paper Tray / Exit Slot -->
  <rect x="146" y="290" width="220" height="16" rx="8" fill="#0284c7"/>

  <!-- Printed Order Output Sheet -->
  <g filter="url(#shadowPaper)">
    <rect x="146" y="295" width="220" height="150" rx="14" fill="url(#paperGrad)"/>
    
    <!-- Header title bar on paper -->
    <rect x="168" y="320" width="176" height="14" rx="6" fill="#0284c7"/>
    
    <!-- Order line items with checkboxes -->
    <!-- Item 1 -->
    <rect x="168" y="348" width="16" height="16" rx="4" fill="#10b981"/>
    <path d="M172 356 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="194" y="351" width="120" height="10" rx="5" fill="#64748b"/>
    <rect x="322" y="351" width="22" height="10" rx="4" fill="#0284c7"/>

    <!-- Item 2 -->
    <rect x="168" y="374" width="16" height="16" rx="4" fill="#10b981"/>
    <path d="M172 382 l3 3 l6 -6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="194" y="377" width="105" height="10" rx="5" fill="#64748b"/>
    <rect x="322" y="377" width="22" height="10" rx="4" fill="#0284c7"/>

    <!-- Item 3 -->
    <rect x="168" y="400" width="16" height="16" rx="4" fill="#e2e8f0" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="194" y="403" width="90" height="10" rx="5" fill="#94a3b8"/>
    <rect x="322" y="403" width="22" height="10" rx="4" fill="#0284c7"/>
  </g>
</svg>
