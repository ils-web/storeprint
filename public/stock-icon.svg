<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Navy / Slate) -->
    <linearGradient id="bgGradStock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="glowGradStock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Box Face Gradients (Amber / Warm Gold Carton) -->
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="boxLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="boxRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="tapeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="boxDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>

    <filter id="checkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradStock)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#glowGradStock)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Isometric Warehouse Box -->
  <g filter="url(#boxDropShadow)">
    <!-- Top Face of Box -->
    <polygon points="256,110 396,184 256,258 116,184" fill="url(#boxTop)"/>

    <!-- Sealing Tape on Top -->
    <polygon points="256,110 274,120 134,194 116,184" fill="url(#tapeGrad)" opacity="0.85"/>
    <polygon points="256,184 396,184 378,194 238,194" fill="url(#tapeGrad)" opacity="0.6"/>

    <!-- Left Face of Box -->
    <polygon points="116,184 256,258 256,396 116,322" fill="url(#boxLeft)"/>

    <!-- Right Face of Box -->
    <polygon points="256,258 396,184 396,322 256,396" fill="url(#boxRight)"/>

    <!-- Front Right Barcode Label -->
    <g transform="matrix(0.88 -0.46 0 1 60 160)">
      <rect x="240" y="190" width="80" height="50" rx="6" fill="#ffffff" opacity="0.95"/>
      <!-- Barcode Bars -->
      <line x1="248" y1="198" x2="248" y2="232" stroke="#0f172a" stroke-width="3"/>
      <line x1="254" y1="198" x2="254" y2="232" stroke="#0f172a" stroke-width="2"/>
      <line x1="260" y1="198" x2="260" y2="232" stroke="#0f172a" stroke-width="4"/>
      <line x1="268" y1="198" x2="268" y2="232" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="273" y1="198" x2="273" y2="232" stroke="#0f172a" stroke-width="3"/>
      <line x1="281" y1="198" x2="281" y2="232" stroke="#0f172a" stroke-width="4"/>
      <line x1="290" y1="198" x2="290" y2="232" stroke="#0f172a" stroke-width="2"/>
      <line x1="297" y1="198" x2="297" y2="232" stroke="#0f172a" stroke-width="3"/>
      <line x1="305" y1="198" x2="305" y2="232" stroke="#0f172a" stroke-width="4"/>
      <line x1="312" y1="198" x2="312" y2="232" stroke="#0f172a" stroke-width="2"/>
    </g>

    <!-- Cyan Laser Scan Line Across Box -->
    <polygon points="80,240 432,210 432,216 80,246" fill="url(#scanBeamGrad)" filter="url(#badgeGlow)"/>
  </g>

  <!-- Stock Counter Stepper Badge (+10 / Fast Count) on Left -->
  <g filter="url(#badgeGlow)">
    <rect x="76" y="320" width="94" height="56" rx="20" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="123" y="356" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" text-anchor="middle">+10</text>
  </g>

  <!-- Verified Count Checkmark Badge on Right -->
  <g filter="url(#checkGlow)">
    <circle cx="388" cy="360" r="38" fill="#10b981" stroke="#34d399" stroke-width="3"/>
    <path d="M372 360 L383 371 L405 348" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small Mobile Device Indicator (Top Right) -->
  <g filter="url(#badgeGlow)" opacity="0.9">
    <rect x="375" y="65" width="46" height="74" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="382" y="74" width="32" height="48" rx="4" fill="#0284c7" opacity="0.4"/>
    <circle cx="398" cy="130" r="3" fill="#38bdf8"/>
    <!-- Small check in phone screen -->
    <path d="M391 98 L396 103 L406 93" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
